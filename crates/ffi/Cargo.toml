[package]
name = "ffi"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "nominal_ffi"
# cdylib: the shared library LabVIEW loads. rlib: lets `cargo test` link the
# crate into test binaries.
crate-type = ["cdylib", "rlib"]

[dependencies]
nominal = "0.6"
once_cell = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }

[build-dependencies]
cbindgen = "0.29"

[dev-dependencies]
serde_json = "1"
wiremock = "0.6"
