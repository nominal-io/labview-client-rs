[package]
name = "ffi"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "nominal_ffi"
# cdylib: the shared library LabVIEW loads. rlib: lets `cargo test` link the
# crate into test binaries.
crate-type = ["cdylib", "rlib"]

[dependencies]
nominal = "0.6"
once_cell = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }

# NOTE: cbindgen is deliberately NOT a build-dependency — it is MPL-2.0,
# which org policy prohibits in the dependency tree. The header is generated
# by the cbindgen CLI instead (`just header`), keeping it out of Cargo.lock.

[dev-dependencies]
serde_json = "1"
wiremock = "0.6"
