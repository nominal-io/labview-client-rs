# cbindgen config — emits crates/ffi/include/nominal_ffi.h on every build.
# Target: LabVIEW's Import Shared Library wizard. Keep the header C-only and
# free of anything the wizard chokes on (C++ namespaces, templates, etc.).
language = "C"

header = """/*
 * nominal_ffi.h — C ABI for the Nominal Rust SDK, generated by cbindgen.
 * DO NOT EDIT — regenerate with `cargo build -p ffi`.
 *
 * Conventions (see error.rs for full details):
 *   - Action functions return int32_t: 0 = success, non-zero = a
 *     NominalErrorCode value. Fetch the message for the most recent error
 *     with nominal_last_error().
 *   - String and count getters return int64_t: >= 0 is the byte count needed
 *     (strings, excluding the null terminator) or the element count; negative
 *     is a negated NominalErrorCode (e.g. -4 = invalid handle). If the byte
 *     count needed is >= the buffer capacity, nothing was written — retry
 *     with a larger buffer.
 *   - Opaque objects are int64_t handles. Handle 0 is never valid and
 *     doubles as "null"/"absent".
 *   - Timestamps are int64_t Unix milliseconds (UTC).
 */"""

include_guard = "NOMINAL_FFI_H"
cpp_compat = false
documentation = true
documentation_style = "c"

usize_is_size_t = true

[export]
# cbindgen only emits types referenced by exported function signatures; these
# enums cross the boundary as plain int32_t, so opt them in explicitly — the
# hand-maintained LabVIEW enum typedefs are kept in sync against them.
include = ["NominalErrorCode", "NominalDataSourceType"]

[enum]
prefix_with_name = true

[parse]
parse_deps = false
