# cbindgen config — emits crates/ffi/include/nominal_ffi.h on every build.
# Target: LabVIEW's Import Shared Library wizard. Keep the header C-only and
# free of anything the wizard chokes on (C++ namespaces, templates, etc.).
language = "C"

header = """/*
 * nominal_ffi.h — C ABI for the Nominal Rust SDK, generated by cbindgen.
 * DO NOT EDIT — regenerate with `cargo build -p ffi`.
 *
 * Conventions (see error.rs for full details):
 *   - Every function returns int32_t: 0 = success, non-zero = a
 *     NominalErrorCode value. All results come back through out-parameters.
 *     Fetch the message for the most recent error with nominal_last_error().
 *   - Strings out: caller supplies a byte buffer + uint32_t capacity; the
 *     byte count needed (excluding the null terminator) is stored in a
 *     uint32_t out-parameter. A null buffer is the supported size query.
 *     A non-null buffer that is too small returns BufferTooSmall and writes
 *     nothing — retry with (needed + 1) bytes.
 *   - Opaque objects are int32_t handles. Handle 0 is never valid and
 *     doubles as "null"/"absent". _list/_search results are handle lists:
 *     read with nominal_handle_list_get, free with nominal_handle_list_free.
 *   - Timestamps are double Unix milliseconds (UTC).
 *   - No 64-bit integers appear anywhere in this API: LabVIEW's Import
 *     Shared Library wizard cannot parse them.
 */"""

include_guard = "NOMINAL_FFI_H"
cpp_compat = false
documentation = true
documentation_style = "c"

# LabVIEW's Import Shared Library wizard has no standard library headers, so
# the emitted header must be fully self-contained: no #includes, and the
# handful of fixed-width types defined inline (guarded so real compilers use
# the real <stdint.h>/<stdbool.h> instead). This is also why the API never
# uses size_t/usize: its width differs between the 32- and 64-bit DLLs, which
# the wizard can't resolve without manual preprocessor definitions.
no_includes = true
after_includes = """

/* Self-contained type definitions: LabVIEW's wizard ships no standard
 * headers. Real compilers (MSVC/GCC/Clang) take the #include branch.
 * Only 8/16/32-bit types appear here — LabVIEW's wizard cannot parse any
 * 64-bit integer type, which is why this API defines none. */
#ifdef _MSC_VER
#include <stdint.h>
#include <stdbool.h>
#else
#ifdef __GNUC__
#include <stdint.h>
#include <stdbool.h>
#else
typedef signed char    int8_t;
typedef unsigned char  uint8_t;
typedef short          int16_t;
typedef unsigned short uint16_t;
typedef int            int32_t;
typedef unsigned int   uint32_t;
typedef unsigned char  bool;
#endif
#endif
"""

[export]
# cbindgen only emits types referenced by exported function signatures; these
# enums cross the boundary as plain int32_t, so opt them in explicitly — the
# hand-maintained LabVIEW enum typedefs are kept in sync against them.
include = ["NominalErrorCode", "NominalDataSourceType"]

[enum]
prefix_with_name = true

[parse]
parse_deps = false
