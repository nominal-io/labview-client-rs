[Asset]
asset.created_at.vi=Returns the asset's creation time.
asset.data_source_count.vi=Returns the number of data sources attached to the asset.
asset.data_source_name_at.vi=Returns the scope name of the data source at the given index.
asset.data_source_rid_at.vi=Returns the RID of the data source at the given index.
asset.data_source_type_at.vi=Returns the kind (dataset, video, or connection) of the data source at the given index.
asset.description.vi=Returns the asset's description, if one is set.
asset.free.vi=Releases the handle and its associated resources.
asset.label_at.vi=Returns the label at the given index.
asset.label_count.vi=Returns the number of labels on the asset.
asset.name.vi=Returns the asset's name.
asset.property_count.vi=Returns the number of properties on the asset.
asset.property_key_at.vi=Returns the key of the property at the given index.
asset.property_value_at.vi=Returns the value of the property at the given index.
asset.rid.vi=Returns the asset's RID.
asset.url.vi=Returns the URL for viewing this asset in the Nominal web app.

[AssetAttachDatasetStaging]
asset.attach_dataset_add_tag.vi=Adds a series-tag filter to the dataset attachment being staged.
asset.attach_dataset_commit.vi=Attaches the staged dataset, with its series-tag filters, to the asset and returns a handle to the updated asset.
asset.attach_dataset_free.vi=Releases the handle and its associated resources.

[AssetCreateStaging]
asset.create_add_label.vi=Adds a label to the asset being created.
asset.create_commit.vi=Creates the staged asset in Nominal and returns a handle to it.
asset.create_free.vi=Releases the handle and its associated resources.
asset.create_set_description.vi=Sets the description for the asset being created.
asset.create_set_property.vi=Sets a property key/value pair on the asset being created.

[AssetUpdateStaging]
asset.update_add_label.vi=Adds a label to the set of labels that will replace the asset's current labels when the update is applied.
asset.update_commit.vi=Applies the staged changes to the asset with the given RID and returns a handle to the updated asset.
asset.update_free.vi=Releases the handle and its associated resources.
asset.update_set_description.vi=Stages a new description for the asset being updated.
asset.update_set_name.vi=Stages a new name for the asset being updated.
asset.update_set_property.vi=Sets a property key/value pair that will replace the asset's current properties when the update is applied.

[Channel]
channel.data_source_rid.vi=Returns the RID of the dataset, video, or connection that owns this channel.
channel.data_type.vi=Returns the channel's data type.
channel.description.vi=Returns the channel's description, if one is set.
channel.free.vi=Releases the handle and its associated resources.
channel.name.vi=Returns the channel's name.
channel.unit.vi=Returns the channel's unit symbol (e.g. "m/s"), if one is set.

[Client]
asset.add_connection.vi=Attaches a connection to the asset under the given scope name and returns a handle to the updated asset.
asset.add_dataset.vi=Attaches a dataset to the asset under the given scope name and returns a handle to the updated asset.
asset.add_video.vi=Attaches a video to the asset under the given scope name and returns a handle to the updated asset.
asset.archive.vi=Archives the asset, hiding it from the UI without deleting it.
asset.create.vi=Creates a new asset in Nominal with the given name and optional description, and returns a handle to it.
asset.get.vi=Fetches the asset with the given RID and returns a handle to it.
asset.list.vi=Lists all assets, newest first, and returns a handle list of them.
asset.search.vi=Searches for assets matching the given text, label, and/or property filters and returns a handle list of matches.
asset.unarchive.vi=Unarchives the asset, restoring its visibility in the UI.
asset.update.vi=Updates an asset's name and/or description and returns a handle to the updated asset.
channel.get.vi=Fetches a specific channel's metadata by data source and channel name.
channel.list.vi=Lists all channels available on a given dataset, video, or connection.
channel.search.vi=Searches for channels matching an optional data source, name substring, and data type, and returns a handle list of matches.
channel.set_metadata.vi=Sets a channel's data type, description, and unit, creating the metadata record if it doesn't already exist.
client.base_url.vi=Returns the API address the client is connected to.
client.free.vi=Releases the handle and its associated resources, closing the connection.
client.workspace_rid.vi=Returns the workspace the client is connected to, if one was set.
dataset.archive.vi=Archives a dataset, hiding it from the UI without deleting it.
dataset.create.vi=Creates a new empty dataset with the given name and optional description and returns a handle to it.
dataset.get.vi=Fetches the dataset with the given RID and returns a handle to it.
dataset.list.vi=Lists all datasets, newest first, and returns a handle list of matches.
dataset.search.vi=Searches for datasets matching the given text, label, and/or property filters and returns a handle list of matches.
dataset.unarchive.vi=Unarchives a dataset, restoring its visibility in the UI.
dataset.update.vi=Updates a dataset's name and/or description, leaving any unspecified field unchanged, and returns a handle to the updated dataset.
ingest.avro_stream.vi=Ingests a Nominal Avro-stream file into an existing dataset.
ingest.job_get.vi=Fetches the current status of an ingest job by its RID.
ingest.job_wait.vi=Waits until an ingest job reaches a final outcome and returns its status.
ingest.journal_json.vi=Ingests a journald JSON log file into an existing dataset.
ingest.video.vi=Ingests a standalone video file into an existing video resource, given its start time.
ingest.video_mcap.vi=Ingests one video stream, selected by topic, out of an MCAP file into an existing video resource.
run.add_attachment.vi=Attaches an already-uploaded file to the run.
run.add_connection.vi=Associates a connection with the run under a named reference and returns a handle to the updated run.
run.add_dataset.vi=Associates a dataset with the run under a named reference and returns a handle to the updated run.
run.add_video.vi=Associates a video with the run under a named reference and returns a handle to the updated run.
run.archive.vi=Archives the run, hiding it from default views.
run.create.vi=Creates a new run in Nominal with a name, start time, and optional description and end time, and returns a handle to it.
run.get.vi=Fetches the run with the given rid and returns a handle to it.
run.list.vi=Lists all runs, newest first, and returns a handle list of matches.
run.remove_attachment.vi=Removes an attachment from the run without deleting the attachment itself.
run.search.vi=Searches for runs matching the given text, label, property, run number, and/or start/end time filters and returns a handle list of matches.
run.unarchive.vi=Restores a previously archived run.
run.update.vi=Updates a run's name and/or description, leaving unspecified fields unchanged, and returns a handle to the updated run.
template.get.vi=Fetches a template by its rid and returns a handle to it.
user.me.vi=Returns a handle to the currently authenticated user.
video.archive.vi=Archives the video, hiding it from default views.
video.create.vi=Creates a new empty video (metadata shell) with a name and optional description in Nominal and returns a handle to it.
video.get.vi=Fetches the video with the given RID and returns a handle to it.
video.list.vi=Lists all videos, newest first, and returns a handle list of matches.
video.search.vi=Searches for videos matching the given text, label, and/or property filters and returns a handle list of matches.
video.unarchive.vi=Restores a previously archived video.
video.update.vi=Updates the video's name and/or description, leaving any unspecified fields unchanged, and returns a handle to the updated video.
workbook.archive.vi=Archives the workbook, hiding it from default views.
workbook.get.vi=Fetches the workbook with the given RID and returns a handle to it.
workbook.list.vi=Lists all workbooks and returns a handle list of matches.
workbook.search.vi=Searches for workbooks matching the given filters (text, label, property, asset, or run) and returns a handle list of matches.
workbook.unarchive.vi=Restores a previously archived workbook.
workspace.list.vi=Returns a handle list of the workspaces the current user can access, sorted by display name.

